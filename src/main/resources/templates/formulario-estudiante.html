<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Estudiante - SpringEduManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-layout">

    <!-- Sidebar (fragmento) -->
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <!-- Contenido principal -->
    <main class="main-content">

        <!-- Topbar (fragmento) -->
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <!-- Contenido -->
        <div class="page-content">

            <div class="page-header">
                <div class="page-header-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h1>Nuevo Estudiante</h1>
            </div>

            <div class="form-card">
                <!-- Ilustración decorativa (SVG simple) -->
                <svg class="form-card-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="80" fill="#f5f3ff"/>
                    <rect x="60" y="90" width="80" height="55" rx="6" fill="#ddd6fe"/>
                    <rect x="65" y="95" width="70" height="45" rx="4" fill="#c4b5fd"/>
                    <rect x="70" y="60" width="60" height="40" rx="6" fill="#a78bfa"/>
                    <rect x="75" y="65" width="50" height="30" rx="3" fill="#ede9fe"/>
                    <text x="100" y="85" font-size="12" text-anchor="middle" fill="#7c5cff" font-weight="700">&lt;/&gt;</text>
                    <circle cx="155" cy="60" r="15" fill="#10b981" opacity="0.6"/>
                    <circle cx="50" cy="140" r="12" fill="#fbbf24" opacity="0.6"/>
                </svg>

                <form th:action="@{/estudiantes/guardar}"
                      th:object="${estudiante}"
                      method="post"
                      class="form-card-body">

                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre:</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" id="nombre" th:field="*{nombre}"
                                   placeholder="Ingresa el nombre del estudiante" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email:</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input type="email" id="email" th:field="*{email}"
                                   placeholder="Ingresa el correo electrónico" required/>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">Guardar</button>
                        <a th:href="@{/estudiantes}" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>

            <!-- Info panel (fragmento) -->
            <div th:replace="~{fragments/layout :: infoPanel}"></div>
        </div>
    </main>
</div>

</body>
</html>
