<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Estudiantes - SpringEduManager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div class="app-layout">

    <!-- Sidebar (fragmento) -->
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <!-- Contenido principal -->
    <main class="main-content">

        <!-- Topbar (fragmento) -->
        <header th:replace="~{fragments/layout :: topbar}"></header>

        <!-- Contenido -->
        <div class="page-content">

            <div class="page-header">
                <div class="page-header-icon">
                    <i class="bi bi-people-fill"></i>
                </div>
                <h1>Lista de Estudiantes</h1>

                <div class="page-header-actions">
                    <a th:href="@{/estudiantes/nuevo}" class="btn-success-custom">
                        <i class="bi bi-plus-lg"></i> Nuevo Estudiante
                    </a>
                </div>
            </div>

            <div class="card-custom">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="estudiante : ${estudiantes}">
                            <td th:text="${estudiante.id}">1</td>
                            <td th:text="${estudiante.nombre}">Nombre</td>
                            <td th:text="${estudiante.email}">email@test.com</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(estudiantes)}">
                            <td colspan="3" class="empty-state">
                                <i class="bi bi-inbox" style="font-size:32px;display:block;margin-bottom:8px;"></i>
                                No hay estudiantes registrados.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Info panel (fragmento) -->
            <div th:replace="~{fragments/layout :: infoPanel}"></div>
        </div>
    </main>
</div>

</body>
</html>
